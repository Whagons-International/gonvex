<!doctype html><meta charset="utf-8"><title>Gonvex OPFS database experiment</title>
<p>Disposable synthetic database benchmark. Results are returned through the worker.</p>
<script type="module">
window.runDatabaseBenchmark = (args) => new Promise((resolve, reject) => {
  const worker = new Worker('./browser-worker.mjs', {type:'module'});
  const timeout = setTimeout(() => { worker.terminate(); reject(Error('Benchmark deadline')); }, 120000);
  worker.onmessage = ({data}) => { clearTimeout(timeout); worker.terminate(); data.error ? reject(Error(data.error)) : resolve(data); };
  worker.onerror = event => { clearTimeout(timeout); worker.terminate(); reject(Error(event.message)); };
  worker.postMessage(args);
});
</script>
