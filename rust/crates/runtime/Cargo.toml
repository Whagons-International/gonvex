[package]
name = "gonvex-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# Unsigned Firebase Auth Emulator tokens never enter release binaries.
[features]
default = []
test-firebase-auth-emulator = []
# Heap profiling builds: use the system allocator instead of mimalloc.
system-alloc = []
# Heap attribution builds: jemalloc with sampled heap profiling
# (`_RJEM_MALLOC_CONF=prof:true,...`, dumps via GONVEX_HEAP_DUMP_PREFIX; read
# them with jeprof). Never in release builds.
jemalloc-prof = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
duckdb = ["dep:duckdb", "dep:calamine"]
# Benchmark fixture (`gonvex_runtime::perf_fixture`): a Whagons-shaped
# Runtime with a fake in-process module host. Never enabled in release builds.
perf-fixture = ["gonvex-websocket/perf-fixture"]

[dependencies]
gonvex-profiler = { path = "../profiler" }
# Process allocator: lower fragmentation under bursty multi-threaded snapshot
# work, and freed memory is returned to the OS promptly.
mimalloc = { version = "=0.1.48", default-features = false }
# Fast seeded hasher for per-event/per-row maps (see `fast_hash`).
foldhash = { version = "=0.1.5" }
tikv-jemallocator = { version = "=0.7.0", features = ["profiling"], optional = true }
tikv-jemalloc-ctl = { version = "=0.7.0", optional = true }
axum.workspace = true
async-trait.workspace = true
aes-gcm.workspace = true
base64.workspace = true
bigdecimal.workspace = true
calamine = { workspace = true, optional = true }
chrono.workspace = true
cron.workspace = true
futures-util.workspace = true
hmac.workspace = true
libc.workspace = true
ipnet.workspace = true
gonvex-module-host = { path = "../module-host" }
gonvex-module-runtime = { path = "../module-runtime" }
gonvex-module-runtime-v8 = { path = "../module-runtime-v8" }
gonvex-protocol = { path = "../protocol" }
gonvex-store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
ryu-js.workspace = true
sha2.workspace = true
sqlx.workspace = true
reqwest.workspace = true
rand.workspace = true
pbkdf2.workspace = true
subtle.workspace = true
jsonwebtoken.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true
duckdb = { workspace = true, optional = true }
gonvex-websocket = { path = "../websocket" }
bytes = "1"
socket2 = { version = "0.6", features = ["all"] }

[lints.clippy]
# Deep clones on hot paths (perf workstreams).
redundant_clone = "warn"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tempfile = "3"
tokio-tungstenite = "0.29"
tower.workspace = true

