[package]
name = "gonvex-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes internal codecs to the runtime's benchmark fixture.
perf-fixture = []

[dependencies]
gonvex-profiler = { path = "../profiler" }
axum.workspace = true
bytes = "1"
futures-util.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
ratchet_core = { version = "1.2.1", features = ["split"] }
ratchet_ext = "1.2.1"
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.clippy]
redundant_clone = "warn"
