# Merge queue for main. Green eligible PRs enter automatically; Mergify
# tests main + the queued PRs together on a temporary mergify/merge-queue/*
# PR (the normal `CI` job runs there via pull_request) and merges the
# batch only when that combined state passes, so PRs never need to be updated
# just because main moved.
queue_rules:
  - name: default
    # Macroscope and review threads are checked on the PR itself; they do not
    # run on Mergify's temporary batch PRs, so they are not injected into the
    # batch conditions. GitHub still enforces branch protection on each merge.
    branch_protection_injection_mode: none
    # Required by Mergify whenever injection is off; merges run as this user.
    merge_bot_account: Desarso
    queue_branch_prefix: mergify/merge-queue/
    queue_conditions:
      - base = main
      # Pending external migration generation is a product/config blocker.
      - label != mergify/configuration-migration
      - label != hold
      - label != needs-review
      - label != needs-browser-test
      - label != product-fit-blocked
      - label != needs-product-fit
      - label != product-fit
      - -draft
      - -conflict
      - "#review-threads-unresolved = 0"
      - check-success = CI
      - check-success = UI merge policy / main
      - or:
          - check-success = Macroscope - Correctness Check
          - check-neutral = Macroscope - Correctness Check
          - check-skipped = Macroscope - Correctness Check
    merge_conditions:
      - check-success = CI
    # Preserve production ancestry so release-gates can fast-forward production.
    merge_method: merge
    batch_size: 5
    batch_max_wait_time: 1 min
    max_checks_retries: 1
    checks_timeout: 45 min


  - name: staging
    # Macroscope and review threads are checked on the PR itself; they do not
    # run on Mergify's temporary batch PRs, so they are not injected into the
    # batch conditions. GitHub still enforces branch protection on each merge.
    branch_protection_injection_mode: none
    # Required by Mergify whenever injection is off; merges run as this user.
    merge_bot_account: Desarso
    queue_branch_prefix: mergify/staging-queue/
    queue_conditions:
      - base = staging
      # Pending external migration generation is a product/config blocker.
      - label != mergify/configuration-migration
      - label != hold
      - label != needs-review
      - label != needs-browser-test
      - label != product-fit-blocked
      - label != needs-product-fit
      - label != product-fit
      - -draft
      - -conflict
      - "#review-threads-unresolved = 0"
      - check-success = CI
      - check-success = UI merge policy / staging
    merge_conditions:
      - check-success = CI
    merge_method: squash
    batch_size: 5
    batch_max_wait_time: 1 min
    max_checks_retries: 1
    checks_timeout: 45 min

merge_queue:
  max_parallel_checks: 3

merge_protections_settings:
  auto_merge_conditions: true
