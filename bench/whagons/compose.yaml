# One private network namespace. No published ports and no external route.
name: gonvex-sqlite-load
services:
  namespace:
    image: alpine:latest
    container_name: gvsq-pod
    command: [sleep, infinity]
    networks: [isolated]
    cpus: 0.1
    mem_limit: 64m
  valkey:
    image: valkey/valkey:8-alpine
    container_name: gvsq-valkey
    network_mode: service:namespace
    command: [valkey-server, --bind, 127.0.0.1]
    cpus: 0.5
    mem_limit: 256m
  auth:
    image: node:26-bookworm-slim
    container_name: gvsq-auth
    network_mode: service:namespace
    cpus: 1
    mem_limit: 768m
    environment:
      CI: '1'
      FIREBASE_CLI_DISABLE_USAGE: 'true'
    volumes:
      - ${LOAD_NPM_CACHE:?set LOAD_NPM_CACHE}:/root/.npm
      - ${LOAD_LAB_ROOT}:/state
      - ./auth.json:/firebase.json:ro
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        if [ -d /state/auth-golden ]; then set -- --import /state/auth-golden;
        elif [ -d /state/auth-export ]; then set -- --import /state/auth-export; else set --; fi;
        exec npx --offline --yes firebase-tools@15.11.0 emulators:start --only auth
        --project demo-whagons-e2e --config /firebase.json
        --export-on-exit /state/auth-export "$$@"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9099').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 120
  runtime:
    # Profiling: LOAD_RUNTIME_IMAGE=gvsq-heaptrack (debian + heaptrack) and
    # LOAD_RUNTIME_COMMAND="heaptrack -o /state/heap /binhost/gonvex-runtime"
    # with a LOAD_FEATURES=gonvex-runtime/system-alloc build.
    image: ${LOAD_RUNTIME_IMAGE:-debian:bookworm-slim}
    container_name: gvsq-runtime
    network_mode: service:namespace
    user: '${LOAD_UID:-0}:${LOAD_GID:-0}'
    cpus: ${LOAD_RUNTIME_CPUS:-4}
    mem_limit: ${LOAD_RUNTIME_MEMORY:-4g}
    memswap_limit: ${LOAD_RUNTIME_MEMORY:-4g}
    working_dir: /state
    command: ${LOAD_RUNTIME_COMMAND:-/binhost/gonvex-runtime}
    volumes:
      # Linux binaries from build.sh (built in rust:bookworm, same glibc).
      - ${LOAD_BIN_DIR:?set LOAD_BIN_DIR}:/binhost:ro
      # SQLite files live on a Docker volume (ext4 in the Docker VM), so sync
      # costs resemble a Linux server rather than a host file share.
      - state:/state
    environment:
      GONVEX_ADDR: 127.0.0.1:8080
      GONVEX_ENV: test
      GONVEX_TEST_AUTH_EMULATOR: 'true'
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      GONVEX_DATA_DIR: /state/data
      GONVEX_SQLITE_SYNCHRONOUS: ${LOAD_SQLITE_SYNCHRONOUS:-full}
      GONVEX_ADMIN_KEY: local-load-admin
      GONVEX_REQUIRE_AUTH: 'true'
      GONVEX_MODULE_HOST_ENABLED: 'true'
      GONVEX_MODULE_HOST_BINARY: /binhost/gonvex-module-host
      GONVEX_SANDBOX_WORKER_BINARY: /binhost/gonvex-sandbox-worker
      GONVEX_DB_MAX_OPEN_CONNS: ${LOAD_READERS:-}
      GONVEX_MODULE_HOST_ISOLATE_POOL_SIZE: ${LOAD_ISOLATES:-}
      GONVEX_REPLICA_SNAPSHOT_CONCURRENCY: ${LOAD_SNAPSHOTS:-}
      GONVEX_MODULE_HOST_MAX_CONCURRENT_CALLS: ${LOAD_MODULE_CONCURRENCY:-32}
      GONVEX_DB_MAX_TOTAL_CONNS: ${LOAD_SHARED:-64}
      GONVEX_SQLITE_CACHE_KIB: ${LOAD_SQLITE_CACHE_KIB:-8192}
      # Allocator tuning experiments (unset: mimalloc defaults).
      MIMALLOC_PURGE_DELAY: ${LOAD_MIMALLOC_PURGE_DELAY:-}
      RUST_LOG: warn
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"']
      interval: 1s
      timeout: 2s
      retries: 120
  # Lab data scripts (reset/fill/staff) against the runtime's volume. Run only
  # while the runtime is stopped.
  tools:
    profiles: [tools]
    # trixie ships SQLite 3.46; bookworm's 3.40 overflows its parser stack on
    # the Whagons task grid projection schema.
    image: python:3.13-slim-trixie
    container_name: gvsq-tools
    network_mode: none
    user: '${LOAD_UID:-0}:${LOAD_GID:-0}'
    working_dir: /harness
    entrypoint: [python3]
    environment:
      LOAD_LAB_ROOT: /lab
      LOAD_RUNTIME_CHECKED: '1'
    volumes:
      - ${LOAD_LAB_ROOT}:/lab
      - state:/lab/runtime
      - .:/harness:ro
  # Container cgroup and pressure telemetry from inside the Docker VM.
  monitor:
    profiles: [tools]
    build:
      dockerfile_inline: |
        FROM docker:28-cli
        RUN apk add --no-cache python3
    container_name: gvsq-monitor
    pid: host
    cgroup: host
    privileged: true
    entrypoint: [python3, /harness/monitor.py]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LOAD_LAB_ROOT}:/lab
      - .:/harness:ro
  generator:
    profiles: [load]
    image: node:26-bookworm-slim
    container_name: gvsq-generator
    network_mode: service:namespace
    depends_on:
      auth: {condition: service_healthy}
      runtime: {condition: service_healthy}
    cpus: ${LOAD_GENERATOR_CPUS:-2}
    mem_limit: ${LOAD_GENERATOR_MEMORY:-2g}
    user: '${LOAD_UID:-1000}:${LOAD_GID:-1000}'
    volumes:
      - ${WHAGONS_CHECKOUT:?set WHAGONS_CHECKOUT}:${WHAGONS_CHECKOUT}:ro
      - ${LOAD_DEPS_ROOT:?set LOAD_DEPS_ROOT}:${LOAD_DEPS_ROOT}:ro
      # Locally linked SDK packages (pnpm link: overrides) resolve outside the checkout.
      - ${LOAD_GONVEX_PACKAGES:?set LOAD_GONVEX_PACKAGES}:${LOAD_GONVEX_PACKAGES}:ro
      - ${LOAD_LAB_ROOT}:/state
      - .:/harness:ro
    environment:
      WHAGONS_CHECKOUT: ${WHAGONS_CHECKOUT}
      LOAD_DEPS_ROOT: ${LOAD_DEPS_ROOT}
      LOAD_URL: http://127.0.0.1:8080
      LOAD_AUTH_URL: http://127.0.0.1:9099
      LOAD_STATE: /state/fixture.json
      LOAD_ADMIN_KEY: local-load-admin
      LOAD_USERS: ${LOAD_USERS:-26}
      LOAD_SECONDS: ${LOAD_SECONDS:-180}
      LOAD_RAMP_SECONDS: ${LOAD_RAMP_SECONDS:-60}
      LOAD_ALL_TENANTS_ACTIVE: ${LOAD_ALL_TENANTS_ACTIVE:-false}
      LOAD_RESULT: /state/${LOAD_LABEL:-step}.json
      LOAD_SHARDS: ${LOAD_SHARDS:-1}
    entrypoint: [/bin/sh, /harness/shards.sh]
volumes:
  state:
    name: gvsq-state
networks:
  isolated:
    internal: true
