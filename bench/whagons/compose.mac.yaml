# One private network namespace. No published ports and no external route.
name: gvmac-load
services:
  namespace:
    image: alpine:latest
    container_name: gvmac-pod
    command: [sleep, infinity]
    networks: [isolated]
    cpus: 0.1
    mem_limit: 64m
  postgres:
    image: postgres:16
    container_name: gvmac-pg
    network_mode: service:namespace
    cpus: 4
    mem_limit: 4g
    environment:
      POSTGRES_PASSWORD: local-load-only
      POSTGRES_DB: gonvex_runtime
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, max_connections=100, -c, log_connections=on]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 1s
      timeout: 2s
      retries: 60
  valkey:
    image: valkey/valkey:8-alpine
    container_name: gvmac-valkey
    network_mode: service:namespace
    command: [valkey-server, --bind, 127.0.0.1]
    cpus: 0.5
    mem_limit: 256m
  auth:
    image: gvmac-generator:local
    container_name: gvmac-auth
    network_mode: service:namespace
    cpus: 1
    mem_limit: 768m
    environment:
      CI: '1'
      FIREBASE_CLI_DISABLE_USAGE: 'true'
    volumes:
      - ${LOAD_NPM_CACHE:?set LOAD_NPM_CACHE}:/root/.npm
      - ${LOAD_LAB_ROOT}:/state
      - ./auth.json:/firebase.json:ro
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        if [ -d /state/auth-export ]; then set -- --import /state/auth-export; else set --; fi;
        exec firebase emulators:start --only auth
        --project demo-whagons-e2e --config /firebase.json
        --export-on-exit /state/auth-export "$$@"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9099').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 120
  runtime:
    image: ${LOAD_RUNTIME_IMAGE:-gvmac-runtime:279}
    container_name: gvmac-runtime
    network_mode: service:namespace
    depends_on:
      postgres: {condition: service_healthy}
    cpus: 4
    mem_limit: 4g
    working_dir: /state
    command: [gonvex-runtime]
    volumes:
      - ${LOAD_LAB_ROOT}/runtime:/state
    environment:
      GONVEX_ADDR: 127.0.0.1:8080
      GONVEX_ENV: test
      GONVEX_TEST_AUTH_EMULATOR: 'true'
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      DATABASE_URL: postgres://postgres:local-load-only@127.0.0.1:5432/gonvex_runtime
      GONVEX_CONTROL_PLANE_DATABASE_URL: postgres://postgres:local-load-only@127.0.0.1:5432/gonvex_runtime
      GONVEX_ADMIN_KEY: local-load-admin
      GONVEX_REQUIRE_AUTH: 'true'
      GONVEX_MODULE_HOST_ENABLED: 'true'
      GONVEX_MODULE_HOST_BINARY: /usr/local/bin/gonvex-module-host
      GONVEX_SANDBOX_WORKER_BINARY: /usr/local/bin/gonvex-sandbox-worker
      GONVEX_DB_MAX_OPEN_CONNS: ${LOAD_MAX_OPEN:-2}
      GONVEX_DB_MAX_IDLE_CONNS: ${LOAD_MAX_IDLE:-2}
      GONVEX_DB_MAX_TOTAL_CONNS: ${LOAD_SHARED:-20}
      GONVEX_DB_IDLE_TIMEOUT_MS: ${LOAD_IDLE_MS:-60000}
      RUST_LOG: warn
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/healthz]
      interval: 1s
      timeout: 2s
      retries: 120
  generator:
    profiles: [load]
    image: gvmac-generator:local
    container_name: gvmac-generator
    network_mode: service:namespace
    depends_on:
      auth: {condition: service_healthy}
      runtime: {condition: service_healthy}
    cpus: 2
    mem_limit: 2g
    volumes:
      - ${LOAD_LAB_ROOT}:/state
      - .:/harness:ro
    environment:
      WHAGONS_CHECKOUT: /app
      LOAD_DEPS_ROOT: /deps/node_modules
      LOAD_URL: http://127.0.0.1:8080
      LOAD_AUTH_URL: http://127.0.0.1:9099
      LOAD_STATE: /state/fixture.json
      LOAD_ADMIN_KEY: local-load-admin
      LOAD_USERS: ${LOAD_USERS:-26}
      LOAD_SECONDS: ${LOAD_SECONDS:-180}
      LOAD_RAMP_SECONDS: ${LOAD_RAMP_SECONDS:-60}
      LOAD_ALL_TENANTS_ACTIVE: ${LOAD_ALL_TENANTS_ACTIVE:-false}
      LOAD_RESULT: /state/${LOAD_LABEL:-step}.json
    entrypoint: [/bin/sh, -c, 'exec "$$LOAD_DEPS_ROOT/.bin/tsx" /harness/run.ts "$$@"', load-runner]
networks:
  isolated:
    internal: true

# The benchmark database uses Docker's local NVMe storage; builds remain on /mnt/data.
volumes:
  postgres_data:
    name: gvmac-load_pg16
