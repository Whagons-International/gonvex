# Stable Gonvex data plane for Coolify.
#
# The runtime and dashboard are intentionally separate Dockerfile Applications.
# Coolify can roll Applications health-first, but cannot roll Compose services.
#
# Storage is SQLite files owned by the runtime, so there is no database service
# here. Attach a persistent volume to the runtime Application at /data and set
# GONVEX_DATA_DIR=/data. The runtime holds /data/.gonvex.lock: configure the
# Application to stop the old container before starting the new one (no
# overlapping rolling deploy on one volume).
#
# This stack keeps only the backup sidecar, which mounts the same named volume
# and snapshots every *.db with SQLite's online backup API.
services:
  gonvex-sqlite-backup:
    build:
      context: infra/sqlite-backup
    restart: unless-stopped
    environment:
      GONVEX_DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - gonvex-sqlite-data:/data
      - gonvex-sqlite-backups:/backups
    command: ["loop"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/gonvex-sqlite-backup", "check"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s

volumes:
  # Shared with the runtime Application's /data persistent storage.
  gonvex-sqlite-data:
    name: ${GONVEX_SQLITE_VOLUME:-gonvex-sqlite-data}
    external: true
  gonvex-sqlite-backups:
