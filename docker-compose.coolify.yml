# Stable Gonvex data plane for Coolify.
#
# The runtime and dashboard are intentionally separate Dockerfile Applications.
# Coolify can roll Applications health-first, but cannot roll Compose services.
# Keeping only durable dependencies here also prevents an application release
# from restarting Postgres or Valkey.
services:
  gonvex-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gonvex
      POSTGRES_PASSWORD: ${GONVEX_POSTGRES_PASSWORD:?}
      POSTGRES_DB: gonvex
    volumes:
      - gonvex-postgres-data:/var/lib/postgresql/data
    networks:
      default:
      coolify-edge:
        aliases:
          - gonvex-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gonvex -d gonvex"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  gonvex-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - ${GONVEX_VALKEY_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - allkeys-lfu
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - gonvex-valkey-data:/data
    networks:
      default:
      coolify-edge:
        aliases:
          - gonvex-valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  gonvex-postgres-data:
  gonvex-valkey-data:

networks:
  coolify-edge:
    external: true
    name: coolify
