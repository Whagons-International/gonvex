# `importFile`'s conversion for the K20 sandbox Container: Rust's own
# `rust/crates/runtime/src/data_ingest.rs`, compiled unchanged (see src/main.rs).
# A standalone package, outside the Rust workspace, so the runtime is not changed.
# Its Cargo.lock was seeded from rust/Cargo.lock: calamine, DuckDB and their
# dependencies resolve to the runtime's versions.
[package]
name = "k20-sandbox-ingest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "k20-ingest"
path = "src/main.rs"

[dependencies]
calamine = "=0.36.1"
duckdb = { version = "=1.4.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
