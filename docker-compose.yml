services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gonvex_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gonvex_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      S3_BUCKET: gonvex-dev
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        GONVEX_DUCKDB: ${GONVEX_DUCKDB:-false}
    working_dir: /var/lib/gonvex
    user: "0:0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GONVEX_ADDR: 0.0.0.0:8080
      GONVEX_CONTROL_PLANE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/gonvex_dev?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/gonvex_dev?sslmode=disable
      GONVEX_TELEMETRY_LOG: /var/lib/gonvex/telemetry.jsonl
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: gonvex-dev
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      GONVEX_PUBLIC_URL: http://localhost:8080
      GONVEX_AUTH_URL: ${GONVEX_AUTH_URL:-http://localhost:8080}
      # Local-only defaults. Production must provide stable random values.
      GONVEX_ADMIN_KEY: ${GONVEX_ADMIN_KEY:-gonvex-local-admin}
      GONVEX_DASHBOARD_SESSION_SECRET: ${GONVEX_DASHBOARD_SESSION_SECRET:-gonvex-local-dashboard-session-secret}
      GONVEX_GOOGLE_CLIENT_ID: ${GONVEX_GOOGLE_CLIENT_ID:-}
      GONVEX_GOOGLE_CLIENT_SECRET: ${GONVEX_GOOGLE_CLIENT_SECRET:-}
      GONVEX_DASHBOARD_AUTH_PROJECT_ID: ${GONVEX_DASHBOARD_AUTH_PROJECT_ID:-}
      GONVEX_TRUSTED_PROXY_CIDRS: ${GONVEX_TRUSTED_PROXY_CIDRS:-}
      GONVEX_AGENT_ACTIONS_ENABLED: ${GONVEX_AGENT_ACTIONS_ENABLED:-false}
      GONVEX_SANDBOX_ENABLED: ${GONVEX_SANDBOX_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - runtime-data:/var/lib/gonvex
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SYS_CHROOT
      - SETUID
      - SETGID
    healthcheck:
      test:
        - CMD-SHELL
        - |
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 30

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_GONVEX_URL: http://localhost:8080
        VITE_GONVEX_RUNTIME_URL: http://localhost:8080
        VITE_GONVEX_AUTH_ENABLED: "false"
        VITE_GONVEX_EMAIL_LOGIN_ENABLED: "false"
        VITE_GONVEX_GOOGLE_LOGIN_ENABLED: "false"
        VITE_GONVEX_DASHBOARD_AUTH_PROJECT_ID: ${GONVEX_DASHBOARD_AUTH_PROJECT_ID:-}
        VITE_GONVEX_ALLOW_UNLISTED_EMAILS: "true"
    restart: unless-stopped
    depends_on:
      runtime:
        condition: service_healthy
    environment:
      DASHBOARD_AUTH_ENABLED: "false"
      DASHBOARD_COOKIE_SECURE: "false"
      GONVEX_RUNTIME_URL: http://runtime:8080
      VITE_GONVEX_RUNTIME_URL: http://localhost:8080
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  runtime-data:
