name: Rust policy verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies:
    name: Verify Rust policy laws
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustc-dev,llvm-tools
      - name: Install pinned Verus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download release/0.2026.10.18.7d82994 --repo verus-lang/verus --pattern verus-0.2026.10.18.7d82994-x86-linux.zip --output verus.zip
          echo 'e9af03732d4bdd32b93a8fcf471706739c24c1473fa5086618d96c47237845dd  verus.zip' | sha256sum -c -
          unzip -q verus.zip
      - name: Prove cursor resume policy and reject broken admission
        run: |
          python3 verification/verus/verify_cursor.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/cursor-proof"
      - name: Prove production allocation and reject broken variants
        run: |
          python3 verification/verus/verify_generation.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/generation-proof"
      - name: Prove mutable ACK progress and reject broken transitions
        run: |
          python3 verification/verus/verify_snapshot_ack.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/snapshot-ack-proof"
      - name: Prove capability policy and reject every gate bypass
        run: |
          python3 verification/verus/verify_capabilities.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/capability-proof"
      - name: Prove frame length policy and reject broken bounds
        run: |
          python3 verification/verus/verify_frame_length.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/frame-proof"
      - name: Prove ACK queue credit release and reject broken accounting
        run: |
          python3 verification/verus/verify_snapshot_credit.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/snapshot-credit-proof"
      - name: Prove invocation budget arithmetic and reject broken selection
        run: |
          python3 verification/verus/verify_budgets.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/budget-proof"
      - name: Prove wire deadline selection and require the root-admission source bridge
        run: |
          python3 verification/verus/verify_host_deadlines.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/host-deadline-proof"
      - name: Retain host deadline proof and broken-policy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-deadline-proof
          path: ${{ runner.temp }}/host-deadline-proof
          if-no-files-found: ignore
      - name: Prove sandbox cleanup identity and require its cancellation ownership bridge
        run: |
          python3 verification/verus/verify_sandbox_ownership.py             --verus "$RUNNER_TEMP/verus-x86-linux/verus"             --output "$RUNNER_TEMP/sandbox-ownership-proof"
      - name: Retain sandbox ownership proof and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-ownership-proof
          path: ${{ runner.temp }}/sandbox-ownership-proof
          if-no-files-found: ignore
      - name: Prove actual SQL key bytes and reject broken serializers
        run: |
          python3 verification/verus/verify_sql_statement_key.py \
            --verus "$RUNNER_TEMP/verus-x86-linux/verus" \
            --output "$RUNNER_TEMP/sql-statement-key-proof"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check finite replica durability model and reject broken policies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYMODEL'
          import json, os, pathlib, re, subprocess
          tool = json.loads(pathlib.Path('verification/tla/toolchain.json').read_text())
          release = re.fullmatch(r'https://github.com/([^/]+/[^/]+)/releases/download/(.+)/([^/]+)', tool['url'])
          assert release, 'expected the pinned upstream GitHub release'
          repository, tag, asset = release.groups()
          subprocess.run(['gh', 'release', 'download', tag, '--repo', repository, '--pattern', asset,
                          '--output', os.environ['RUNNER_TEMP'] + '/tla2tools.jar'], check=True)
          PYMODEL
          python3 verification/tla/check_replica_durability.py \
            --jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/replica-durability-model"
      - name: Check async ownership schedules and reject missing await guards
        run: |
          python3 verification/tla/check_async_ownership.py \
            --jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/async-ownership-model"
      - name: Check native permit retirement composition and broken cleanup policies
        run: |
          python3 verification/tla/check_permit_retirement.py \
            --jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/permit-retirement-model"
      - name: Retain permit retirement model and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permit-retirement-model
          path: ${{ runner.temp }}/permit-retirement-model
          if-no-files-found: ignore
      - name: Retain async ownership model and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-ownership-model
          path: ${{ runner.temp }}/async-ownership-model
          if-no-files-found: ignore
      - name: Retain protocol model and negative counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replica-durability-model
          path: ${{ runner.temp }}/replica-durability-model
          if-no-files-found: ignore
      - name: Check finite receipt protocol and reject broken policies
        run: |
          python3 verification/tla/check_reducer_receipts.py \
            --jar "$RUNNER_TEMP/tla2tools.jar" \
            --output "$RUNNER_TEMP/reducer-receipts-model"
      - name: Retain receipt model and negative counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reducer-receipts-model
          path: ${{ runner.temp }}/reducer-receipts-model
          if-no-files-found: ignore
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install frozen SDK proof dependencies
        run: |
          corepack enable && corepack prepare pnpm@11.1.2 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove actual TypeScript revision policies and reject broken variants
        run: |
          node --test verification/typescript/verify-revisions.test.mjs
          node verification/typescript/verify-revisions.mjs \
            --z3 "$RUNNER_TEMP/verus-x86-linux/z3" \
            --output "$RUNNER_TEMP/sdk-revision-proof"
      - name: Prove delivery and receipt settlement invariants and reject broken transitions
        run: |
          node --test verification/typescript/verify-outbox.test.mjs
          node verification/typescript/verify-outbox.mjs \
            --z3 "$RUNNER_TEMP/verus-x86-linux/z3" \
            --output "$RUNNER_TEMP/sdk-delivery-proof"
      - name: Prove actual SDK ownership guard and reject broken owner admission
        run: |
          node --test verification/typescript/verify-ownership.test.mjs verification/typescript/query-publication.test.mjs verification/typescript/control-watch-publication.test.mjs
          node verification/typescript/verify-ownership.mjs \
            --z3 "$RUNNER_TEMP/verus-x86-linux/z3" \
            --output "$RUNNER_TEMP/sdk-ownership-proof"
      - name: Prove recovered intent coalescing admission and reject broken provenance gates
        run: |
          node --test verification/typescript/verify-coalescing.test.mjs
          node verification/typescript/verify-coalescing.mjs \
            --z3 "$RUNNER_TEMP/verus-x86-linux/z3" \
            --output "$RUNNER_TEMP/sdk-coalescing-proof"
      - name: Prove deferred watermark guards and reject retained owner readiness
        run: |
          node --test verification/typescript/verify-opening-watermarks.test.mjs
          node verification/typescript/verify-opening-watermarks.mjs \
            --z3 "$RUNNER_TEMP/verus-x86-linux/z3" \
            --output "$RUNNER_TEMP/sdk-opening-watermark-proof"
      - name: Prove replica sequence admission and reject unsafe counter transitions
        run: |
          node --test verification/typescript/verify-replica-sequences.test.mjs
          node verification/typescript/verify-replica-sequences.mjs \
            --z3 "$RUNNER_TEMP/verus-x86-linux/z3" \
            --output "$RUNNER_TEMP/sdk-replica-sequence-proof"
      - name: Retain SDK source and solver receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-revision-proof
          path: |
            ${{ runner.temp }}/sdk-revision-proof
            ${{ runner.temp }}/sdk-delivery-proof
            ${{ runner.temp }}/sdk-ownership-proof
            ${{ runner.temp }}/sdk-coalescing-proof
            ${{ runner.temp }}/sdk-opening-watermark-proof
            ${{ runner.temp }}/sdk-replica-sequence-proof
          if-no-files-found: ignore

  receipt_fixture:
    name: Native receipt fixture
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GONVEX_TEST_MODULE_HOST_BINARY: ${{ github.workspace }}/rust/target/debug/gonvex-module-host
      GONVEX_RECEIPT_TEST_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build native module host
        working-directory: rust
        run: cargo build --locked -p gonvex-module-host --bin gonvex-module-host
      - name: Run required native receipt regressions
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GONVEX_TEST_MODULE_HOST_BINARY"
          cargo test --locked -p gonvex-runtime --lib tests::receipt_guarantee_tests -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/native-receipts.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/native-receipts.log"
      - name: Retain native receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-receipts
          path: ${{ runner.temp }}/native-receipts.log
          if-no-files-found: ignore
