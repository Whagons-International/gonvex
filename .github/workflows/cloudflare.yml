name: Cloudflare

# Typecheck and workerd tests for cloudflare/ on pull requests to the
# integration branch, plus a per-PR preview Worker
# (gonvex-cf-dev-preview-<branch-slug>) that is deleted when the PR closes.
# This workflow never runs for main or staging and never deploys them.
on:
  pull_request:
    branches: [cloudflare/integration]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  # A01 transform drift, nightly. GitHub runs schedules from the default
  # branch only, so this takes effect once the file is on main.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  check:
    name: Typecheck and workerd tests
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install cloudflare workspace
        run: pnpm install --frozen-lockfile --filter @gonvex/cloudflare
      - name: Typecheck
        run: pnpm typecheck
      - name: Test in workerd
        run: pnpm test
      - name: Bundle size
        run: |
          pnpm bundle
          echo "### Worker bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "\`dist/index.js\`: $(wc -c < dist/index.js) bytes, $(gzip -c dist/index.js | wc -c) gzip" >> "$GITHUB_STEP_SUMMARY"

  conformance-unit:
    name: Conformance unit tests
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/conformance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Normalizer, differ and digest self-check; no backend or install needed.
      # Rust against Rust (node src/cli.mjs) stays a manual run (see README).
      - name: Unit tests
        run: node --test test/*.test.mjs

  preview:
    name: Deploy preview Worker
    needs: check
    # Same-repo PRs only: fork PRs never receive secrets.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
      PREVIEW_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check deploy secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_DEV_ACCOUNT_ID / CLOUDFLARE_DEV_API_TOKEN are not set; skipping the preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        if: steps.secrets.outputs.ready == 'true'
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install cloudflare workspace
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @gonvex/cloudflare
      - name: Deploy and smoke-test preview
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/deploy-preview.mjs deploy --branch "$PREVIEW_BRANCH"
      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        working-directory: .
        env:
          PREVIEW_NAME: ${{ steps.deploy.outputs.name }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Preview $PREVIEW_NAME at $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete preview Worker
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEV_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
      PREVIEW_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check deploy secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy secrets are not set; nothing to delete."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        if: steps.secrets.outputs.ready == 'true'
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install cloudflare workspace
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @gonvex/cloudflare
      - name: Delete preview
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/deploy-preview.mjs delete --branch "$PREVIEW_BRANCH"

  # A01 (contract-changes/0014, rule 5): run the kernel schema transform over
  # the app's current staging migrations, so a construct it cannot handle
  # shows up before cutover. Also (0022 §2a, §5): every REGEXP pattern in the
  # app's module sources must compile with K01's translator, and no module
  # source may name a storage table that carries T3's generated columns.
  # Read-only: a sparse, shallow clone of whagons5-client `staging`
  # (`migrations/` and `gonvex/`), with a read-only deploy key.
  transform-drift:
    name: Schema transform over whagons5-client staging
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_DEPLOY_KEY: ${{ secrets.WHAGONS_CLIENT_DEPLOY_KEY }}
    steps:
      - name: Check read access to whagons5-client
        id: access
        run: |
          if [ -n "$CLIENT_DEPLOY_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::WHAGONS_CLIENT_DEPLOY_KEY is not set: the app's staging migrations were NOT checked for transform drift."
            echo "### Transform drift: not checked (WHAGONS_CLIENT_DEPLOY_KEY is not set)" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.access.outputs.ready == 'true'
        with:
          persist-credentials: false
      - name: Fetch whagons5-client staging migrations (read-only)
        if: steps.access.outputs.ready == 'true'
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/client-key"
          printf '%s\n' "$CLIENT_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 --branch staging --filter=blob:none --sparse \
            git@github.com:Whagons-International/whagons5-client.git "$RUNNER_TEMP/client"
          git -C "$RUNNER_TEMP/client" sparse-checkout set migrations gonvex
          rm -f "$key"
          echo "CLIENT_SHA=$(git -C "$RUNNER_TEMP/client" rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        if: steps.access.outputs.ready == 'true'
        with:
          node-version: "24"
      # No install: the transform is dependency-free TypeScript that Node runs directly.
      - name: Transform the staging migrations
        if: steps.access.outputs.ready == 'true'
        run: |
          node cloudflare/kernel/schema-transform/verify/transform-migrations.mjs "$RUNNER_TEMP/client/migrations" \
            --prelude cloudflare/kernel/migrate/runtime-prelude.sql --json "$RUNNER_TEMP/drift.json"
      - name: REGEXP patterns and generated-column tables in the app's module sources
        if: steps.access.outputs.ready == 'true'
        run: |
          node --experimental-transform-types cloudflare/kernel/schema-transform/verify/app-source-checks.mjs \
            "$RUNNER_TEMP/client" --json "$RUNNER_TEMP/app-checks.json"
      - name: Summary
        if: always() && steps.access.outputs.ready == 'true'
        run: |
          {
            echo "### Transform drift: whagons5-client staging \`$CLIENT_SHA\`"
            if [ -f "$RUNNER_TEMP/drift.json" ]; then
              node -e 'const r=require(process.argv[1]);console.log(`transform ${r.version}: ${r.migrations.length} migrations, ${r.migrations.reduce((s,m)=>s+m.source,0)} statements in, ${r.migrations.reduce((s,m)=>s+m.output,0)} out, ${r.added.count} added objects, ${r.ms} ms`)' "$RUNNER_TEMP/drift.json"
            else
              echo "Failed: see the step log for the migration, object and limit."
            fi
            if [ -f "$RUNNER_TEMP/app-checks.json" ]; then
              node -e 'const r=require(process.argv[1]);console.log(`app sources: ${r.files} files; REGEXP patterns ${r.regexp.patterns.map(p=>"\`"+p.source+"\` "+(p.compiles?"compiles":"NOT compiled")).join(", ")||"none"} (compiler: ${r.regexp.compiler??"K01 not in tree"}); generated-column tables ${r.generatedColumnTables.join(", ")}: ${r.storageTableMentions.length} mentions; failures ${r.failures.length}`)' "$RUNNER_TEMP/app-checks.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
