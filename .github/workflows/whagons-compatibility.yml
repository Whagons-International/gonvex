name: Whagons compatibility

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Require a pinned Whagons integration revision
        env:
          CLIENT_REF: ${{ vars.WHAGONS_COMPAT_REF }}
        run: |
          if ! [[ "$CLIENT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set WHAGONS_COMPAT_REF to the tested Whagons commit containing the compatibility suite"
            exit 1
          fi
  compatibility:
    needs: configuration
    # Bootstrap on staging. Pin this workflow reference to a reviewed commit
    # after the client workflow lands; client_ref below pins application code.
    uses: Whagons-International/whagons5-client/.github/workflows/release-compatibility.yml@staging
    with:
      gonvex_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      client_ref: ${{ vars.WHAGONS_COMPAT_REF }}
    secrets:
      COMPAT_REPO_TOKEN: ${{ secrets.COMPAT_REPO_TOKEN }}
      MOBILE_APP_CHECKOUT_TOKEN: ${{ secrets.MOBILE_APP_CHECKOUT_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
      COMPAT_TEST_EMAIL: ${{ secrets.COMPAT_TEST_EMAIL }}
      COMPAT_TEST_PASSWORD: ${{ secrets.COMPAT_TEST_PASSWORD }}
      COMPAT_FIREBASE_API_KEY: ${{ secrets.COMPAT_FIREBASE_API_KEY }}
  gate:
    name: Whagons compatibility
    if: always()
    needs: [configuration, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require completed compatibility tests
        env:
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$CONFIGURATION_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
