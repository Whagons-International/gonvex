name: Runtime regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Validate repository script contracts
        run: node --test scripts/*.test.mjs
      - name: Test Go runtime
        run: go test -count=1 -p 1 ./...
        env:
          GOMAXPROCS: "2"
      - name: Vet Go compatibility and migration tooling
        run: go vet ./...
      - name: Race-test Go compatibility and migration tooling
        run: go test -race -count=1 -p 1 ./...
        env:
          GOMAXPROCS: "2"
      - name: Test PostgreSQL scheduler durability and rolling migration
        run: go test -count=1 ./server/internal/server -run '^(TestPostgresScheduled|TestMigratingScheduler)'
        env:
          GONVEX_TEST_POSTGRES_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
      - name: Build JavaScript packages
        run: pnpm build:packages
      - name: Test JavaScript workspace
        run: pnpm -r test
      - name: Type-check JavaScript workspace
        run: pnpm typecheck
      - name: Verify publishable npm tarballs
        run: pnpm verify:package-tarballs
      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Test Rust runtime with PostgreSQL
        working-directory: rust
        run: cargo test --locked --workspace --all-targets -- --test-threads=1
        env:
          GONVEX_TEST_POSTGRES_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
      - name: Lint Rust runtime
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
