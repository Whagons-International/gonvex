name: Runtime regression

on:
  pull_request:
  # Seed caches on the PR base, including Mergify's staging queue.
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: runtime-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policies:
    uses: ./.github/workflows/rust-policy-verification.yml

  native:
    uses: ./.github/workflows/native-sqlite-verification.yml

  test:
    name: Runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch pinned V8 through the authenticated release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; packages=tomllib.load(open("rust/Cargo.lock","rb"))["package"]; versions={p["version"] for p in packages if p["name"]=="v8"}; assert len(versions)==1; print(versions.pop())')
          archive_dir="$RUNNER_TEMP/rusty-v8"
          mkdir -p "$archive_dir"
          gh release download "v$version" --repo denoland/rusty_v8 --pattern librusty_v8_release_x86_64-unknown-linux-gnu.a.gz --dir "$archive_dir"
          gzip -t "$archive_dir/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz"
          echo "RUSTY_V8_ARCHIVE=$archive_dir/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz" >> "$GITHUB_ENV"
      - name: Check isolated-load destination, privacy and qualification guards
        run: |
          node --test bench/whagons/safety.test.mjs
          python3 bench/whagons/summary.test.py
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      # JS local-runtime tests also invoke Cargo; restore before either suite.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      # packages/gonvex local-bindings tests execute generated code in headless Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Reject retired Go sources
        run: test -z "$(find . -path ./node_modules -prune -o -path ./rust/target -prune -o \( -name '*.go' -o -name go.mod -o -name go.sum \) -print)"
      - name: Check generated SQLite schema capabilities
        run: node scripts/sync-sqlite-schema-options.mjs --check
      - name: Build JavaScript packages
        run: pnpm build:packages
      - name: Require historical SQLite transaction crash recovery and reject rearmed acceptance
        run: python3 verification/native-sqlite/check_historical_node.py --output "${{ runner.temp }}/historical-sqlite-node"
      - name: Retain historical SQLite process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-sqlite-node
          path: ${{ runner.temp }}/historical-sqlite-node
          if-no-files-found: ignore
      - name: Verify native browser IndexedDB durability and SDK barriers
        run: pnpm --filter @gonvex/client test:browser-storage
        env:
          GONVEX_BROWSER_TEST_DIR: ${{ runner.temp }}/indexeddb-guarantees
          GONVEX_BROWSER_TEST_OUTPUT: ${{ runner.temp }}/indexeddb-guarantees.json
          GONVEX_BROWSER_UPGRADE_OUTPUT: ${{ runner.temp }}/indexeddb-upgrades.json
      - name: Retain browser persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexeddb-guarantees
          path: |
            ${{ runner.temp }}/indexeddb-guarantees.json
            ${{ runner.temp }}/indexeddb-upgrades.json
          if-no-files-found: ignore
      # Some script contracts import built package output (packages/*/dist).
      - name: Validate repository script contracts
        run: node --test scripts/*.test.mjs
      - name: Test JavaScript workspace
        run: pnpm -r test
      - name: Require post-storage watermark and readiness ownership and reject compiled stale completion controls
        run: node verification/typescript/check-watermark-publication-runtime.mjs --output "${{ runner.temp }}/watermark-publication-runtime"
      - name: Retain watermark ownership execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermark-publication-runtime
          path: ${{ runner.temp }}/watermark-publication-runtime
          if-no-files-found: ignore
      - name: Require native browser intent observer ownership and stale source controls
        env:
          GONVEX_BROWSER_TEST_DIR: ${{ runner.temp }}/intent-browser
          GONVEX_INTENT_BROWSER_OUTPUT: ${{ runner.temp }}/intent-browser.json
        run: node --test packages/client/test/browser-intent-ownership.check.mjs
      - name: Retain native browser intent ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-browser
          path: ${{ runner.temp }}/intent-browser.json
          if-no-files-found: ignore
      - name: Require intent snapshot activation ownership and reject compiled stale publication
        run: node verification/typescript/check-intent-publication-runtime.mjs --output "${{ runner.temp }}/intent-publication-runtime"
      - name: Retain intent snapshot ownership execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-publication-runtime
          path: ${{ runner.temp }}/intent-publication-runtime
          if-no-files-found: ignore
      - name: Type-check JavaScript workspace
        run: pnpm typecheck
      - name: Require ordered query publication and reject compiled stale callback controls
        run: node verification/typescript/check-query-publication-runtime.mjs --output "${{ runner.temp }}/query-publication-runtime"
      - name: Require Control Query watch ownership, reuse and reconnect controls
        run: node verification/typescript/check-control-watch-runtime.mjs --output "${{ runner.temp }}/control-watch-runtime"
      - name: Require actual browser WebSocket close and scope-clear ownership
        env:
          GONVEX_BROWSER_TEST_DIR: ${{ runner.temp }}/control-close-browser
          GONVEX_CONTROL_CLOSE_BROWSER_OUTPUT: ${{ runner.temp }}/control-close-browser.json
        run: node --test packages/client/test/browser-control-close.check.mjs
      - name: Require native IndexedDB query publication and transaction-abort controls
        env:
          GONVEX_BROWSER_TEST_DIR: ${{ runner.temp }}/query-publication-browser
          GONVEX_QUERY_BROWSER_OUTPUT: ${{ runner.temp }}/query-publication-browser.json
        run: node --test packages/client/test/browser-query-publication.check.mjs
      - name: Retain query publication execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-publication
          path: |
            ${{ runner.temp }}/query-publication-runtime
            ${{ runner.temp }}/control-watch-runtime
            ${{ runner.temp }}/control-close-browser.json
            ${{ runner.temp }}/query-publication-browser.json
          if-no-files-found: ignore
      - name: Verify publishable npm tarballs
        run: pnpm verify:package-tarballs
      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Keep analysis dependencies out of default builds
        working-directory: rust
        run: |
          python3 - <<'PY'
          import subprocess
          tree = subprocess.check_output(["cargo", "tree", "--locked", "-p", "gonvex-runtime", "-p", "gonvex-sandbox-worker", "-e", "normal", "--prefix", "none"], text=True)
          forbidden = {"duckdb", "libduckdb-sys", "calamine"}
          found = {line.split()[0] for line in tree.splitlines() if line.split()} & forbidden
          assert not found, f"Default build includes analysis dependencies: {found}"
          PY
      - name: Test Rust runtime with SQLite
        working-directory: rust
        run: |
          set -euo pipefail
          cc -shared -fPIC -o "$RUNNER_TEMP/slow-checkpoint-sync.so" crates/store/tests/slow_checkpoint_sync.c -ldl -lpthread
          # Only writer_durability receives delayed syncs. Its batching proof
          # requires overlap; ordinary fast-disk timing does not guarantee it.
          LD_PRELOAD="$RUNNER_TEMP/slow-checkpoint-sync.so" cargo test --locked --workspace --all-targets -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-runtime-tests.log"
          grep -Eq 'gonvex-writer-io-fixture: wal_delays=[1-9][0-9]* ' "$RUNNER_TEMP/native-runtime-tests.log"
      - name: Keep the WAL cap under background checkpoint I/O contention
        working-directory: rust
        run: |
          LD_PRELOAD="$RUNNER_TEMP/slow-checkpoint-sync.so" cargo test --locked -p gonvex-store --test writer_durability checkpoints_run_off_the_writer_and_the_wal_stays_bounded -- --exact --test-threads=1
      - name: Require native root-admission deadlines, nested progress and exact permit capacity
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p gonvex-module-host --lib session::admission_tests -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/root-admission.log"
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/root-admission.log"
      - name: Retain native root-admission execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-admission
          path: ${{ runner.temp }}/root-admission.log
          if-no-files-found: ignore
      - name: Require sandbox cancellation cleanup and originating execution ownership
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p gonvex-runtime --lib sandbox::cancellation_tests -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/sandbox-cancellation.log"
          grep -F 'test result: ok. 8 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/sandbox-cancellation.log"
      - name: Retain sandbox cancellation execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-cancellation
          path: ${{ runner.temp }}/sandbox-cancellation.log
          if-no-files-found: ignore
      - name: Require native sandbox exit to retain capacity and permit later reuse
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust/Cargo.toml -p gonvex-runtime --lib --no-run --message-format=json > "$RUNNER_TEMP/sandbox-retirement-build.jsonl"
          python3 verification/backend-receipts/check_sandbox_retirement.py             --build-metadata "$RUNNER_TEMP/sandbox-retirement-build.jsonl"             --output "$RUNNER_TEMP/sandbox-retirement"
      - name: Retain native sandbox exit and capacity witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-retirement
          path: |
            ${{ runner.temp }}/sandbox-retirement-build.jsonl
            ${{ runner.temp }}/sandbox-retirement
          if-no-files-found: ignore
      - name: Require real tenant membership and receipt namespace isolation
        working-directory: rust
        env:
          GONVEX_TENANT_ISOLATION_REQUIRE_NATIVE: "1"
        run: cargo test --locked -p gonvex-store --test tenant_isolation -- --test-threads=1
      - name: Build module host for required native receipt regressions
        working-directory: rust
        run: cargo build --locked -p gonvex-module-host --bin gonvex-module-host
      # G1-visibility-no-fanout: statement budgets on real collections. Only
      # this step sets the module host, so other module-host suites keep their
      # existing CI scope.
      - name: Enforce visibility fan-out budgets
        working-directory: rust
        run: cargo test --locked -p gonvex-runtime --test visibility_fanout -- --test-threads=1 --nocapture
        env:
          GONVEX_TEST_MODULE_HOST_BINARY: ${{ github.workspace }}/rust/target/debug/gonvex-module-host
          GONVEX_VIS_FANOUT_REQUIRED: "1"
          GONVEX_VIS_FANOUT_MEMBERS: "200"
      - name: Test native receipt replay and rollback guarantees
        working-directory: rust
        shell: bash
        env:
          GONVEX_TEST_MODULE_HOST_BINARY: ${{ github.workspace }}/rust/target/debug/gonvex-module-host
          GONVEX_RECEIPT_TEST_REQUIRE_NATIVE: "1"
        run: |
          set -euo pipefail
          test -x "$GONVEX_TEST_MODULE_HOST_BINARY"
          cargo test --locked -p gonvex-runtime --lib tests::receipt_guarantee_tests -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/native-receipts.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/native-receipts.log"
      - name: Build exact runtime artifact for process crash recovery
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p gonvex-runtime --lib --no-run --message-format=json > "$RUNNER_TEMP/receipt-crash-build.jsonl"
      - name: Require legacy receipt preservation and safe initialization
        working-directory: rust
        shell: bash
        env:
          GONVEX_TEST_MODULE_HOST_BINARY: ${{ github.workspace }}/rust/target/debug/gonvex-module-host
          GONVEX_RECEIPT_TEST_REQUIRE_NATIVE: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p gonvex-runtime --lib tests::receipt_guarantee_tests::receipt_initialization_ -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/receipt-initialization.log"
          for case in preserves_legacy_replay refuses_ambiguous_histories repairs_missing_index_and_observes_schema_reset serializes_cold_callers cancellation_releases_lock_and_admission; do
            grep -F "test tests::receipt_guarantee_tests::receipt_initialization_$case ... " "$RUNNER_TEMP/receipt-initialization.log"
          done
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/receipt-initialization.log"
          cargo test --locked -p gonvex-runtime --lib tests::receipt_guarantee_tests::receipt_lookup_progresses_while_snapshot_preparations_own_pool_connections -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/snapshot-pool-progress.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/snapshot-pool-progress.log"
          cargo test --locked -p gonvex-runtime --lib replica_open_queue::tests::cancellation_drops_started_work_without_polling_completion -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/snapshot-task-cancellation.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/snapshot-task-cancellation.log"
      - name: Retain receipt initialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-initialization
          path: |
            ${{ runner.temp }}/receipt-initialization.log
            ${{ runner.temp }}/snapshot-pool-progress.log
            ${{ runner.temp }}/snapshot-task-cancellation.log
          if-no-files-found: error
      - name: Require receipt and business effects across runtime process crashes
        run: |
          python3 verification/backend-receipts/check_restart.py \
            --build-metadata "$RUNNER_TEMP/receipt-crash-build.jsonl" \
            --module-host rust/target/debug/gonvex-module-host \
            --output "$RUNNER_TEMP/receipt-crash-recovery"
      - name: Require authenticated SDK, receipt and durable replica composition
        run: |
          python3 verification/backend-receipts/check_sdk.py \
            --build-metadata "$RUNNER_TEMP/receipt-crash-build.jsonl" \
            --module-host rust/target/debug/gonvex-module-host \
            --output "$RUNNER_TEMP/sdk-receipt-composition"
      - name: Retain authenticated SDK composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-receipt-composition
          path: ${{ runner.temp }}/sdk-receipt-composition
          if-no-files-found: ignore
      - name: Require SDK identity and completeness through backend contract replacement
        run: |
          python3 verification/backend-receipts/check_module_upgrade.py \
            --build-metadata "$RUNNER_TEMP/receipt-crash-build.jsonl" \
            --module-host rust/target/debug/gonvex-module-host \
            --output "$RUNNER_TEMP/sdk-module-upgrade"
      - name: Retain backend contract upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-module-upgrade
          path: ${{ runner.temp }}/sdk-module-upgrade
          if-no-files-found: error
      - name: Retain runtime crash-recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-crash-recovery
          path: ${{ runner.temp }}/receipt-crash-recovery
          if-no-files-found: ignore
      - name: Test opt-in debug Firebase Auth Emulator verification
        working-directory: rust
        run: cargo test --locked -p gonvex-runtime --lib external_auth::tests --features test-firebase-auth-emulator
      - name: Lint Rust runtime
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test optional DuckDB analysis
        working-directory: rust
        run: |
          cargo test --locked -p gonvex-runtime --features duckdb --lib data_ingest::tests
          cargo test --locked -p gonvex-sandbox-worker --features duckdb --all-targets
          cargo clippy --locked -p gonvex-runtime -p gonvex-sandbox-worker --features gonvex-runtime/duckdb,gonvex-sandbox-worker/duckdb --all-targets -- -D warnings

  ci:
    name: CI
    if: always()
    needs: [test, policies, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require runtime tests, Rust policy proofs and native storage checks
        env:
          RUNTIME_RESULT: ${{ needs.test.result }}
          POLICY_RESULT: ${{ needs.policies.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$POLICY_RESULT" = success
          test "$NATIVE_RESULT" = success
