name: Admission regression validation
on:
  push:
    branches: [fix/tenant-pool-admission-1029]
permissions:
  contents: read
concurrency:
  group: admission-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    name: PostgreSQL admission / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            source: baseline
          - variant: fixed
            source: candidate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CARGO_BUILD_JOBS: "2"
      GONVEX_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        if: matrix.variant == 'baseline'
        with:
          ref: 6027f7db24c821d940d84dfd71914a47e05ea7d1
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.source }}/rust
          cache-on-failure: true
      - name: Prove the regression fails on unmodified staging
        if: matrix.variant == 'baseline'
        shell: bash
        run: |
          cp candidate/rust/crates/postgres/tests/pool_admission.rs baseline/rust/crates/postgres/tests/
          set +e
          cargo test --locked --manifest-path baseline/rust/Cargo.toml -p gonvex-postgres --test pool_admission busy_tenant_waiters_leave_shared_capacity_for_other_tenants_and_control -- --exact --nocapture > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -ne 0
          grep -F 'requests waiting for a tenant slot must not reserve shared capacity' baseline.log
          grep -F 'left: 2' baseline.log
      - name: Test fixed PostgreSQL library and all integration cases
        if: matrix.variant == 'fixed'
        run: cargo test --locked --manifest-path candidate/rust/Cargo.toml -p gonvex-postgres --all-targets -- --test-threads=1
      - name: Lint fixed PostgreSQL code
        if: matrix.variant == 'fixed'
        run: cargo clippy --locked --manifest-path candidate/rust/Cargo.toml -p gonvex-postgres --all-targets -- -D warnings
      - name: Check runtime callers
        if: matrix.variant == 'fixed'
        run: cargo check --locked --manifest-path candidate/rust/Cargo.toml -p gonvex-runtime --all-targets
